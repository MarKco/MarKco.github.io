---
layout: default
title: Blog
permalink: /blog/
---
<section class="block wrap">
  <h2>Blog</h2>
  <ul class="post-list">
    {% for post in site.posts %}
      <li>
        <span class="post-date">{{ post.date | date: "%-d %B %Y" }}</span>
        <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
      </li>
    {% endfor %}
  </ul>
</section>
